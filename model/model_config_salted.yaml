# FishModel config for the salted-water dataset.
# Input X: (N, 39, 13)
#   channels 0-11 : 12 acoustic time-series (per-file z-scored)
#   channel  12   : salt level, constant across time, normalised to [0,1]
#                   (0 g/L → 0.0,  400 g/L → 1.0)

input_channels: 12        # acoustic channels fed to the temporal CNN
physics_dim: 1            # salt scalar fed to the physics MLP
physics_hidden: 32        # small — only 1 input feature
dropout_physics: 0.1

dropout_temporal: 0.3
hidden_dim: 128
dropout_fc: 0.3
