data_dir:   data/carp/salted_water_split/
train_file: data/carp/salted_water_split/train_salt_natural.npz
val_file:   data/carp/salted_water_split/val_salt_natural.npz

batch_size:   64
max_epochs:   400
lr:           1.0e-3
weight_decay: 1.0e-4

# BCE with pos_weight to handle 20% positive rate (neg/pos ≈ 4).
# BCEWithLogitsLoss + pos_weight gives a reliable val_loss signal, so
# best-val-loss checkpoint selection finds a genuinely good model.
use_focal_loss: false
pos_weight:     4.0

huber_delta:  0.3

loss_weight_presence: 0.4
loss_weight_weight:   1.0
loss_weight_aux:      0.1

log_scale_weight:     true
weight_noise_std:     0.05

lr_patience:              30
early_stopping_patience:  80

checkpoint_dir: checkpoints/salted_water_salt_model_v3/
