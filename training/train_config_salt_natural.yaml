data_dir:   data/carp/salted_water_split/
train_file: data/carp/salted_water_split/train_salt_natural.npz
val_file:   data/carp/salted_water_split/val_salt_natural.npz

batch_size:   64       # larger batch stabilises focal loss on imbalanced data
max_epochs:   400
lr:           1.0e-3
weight_decay: 1.0e-4

# Focal loss — no pos_weight, no hard-coded ratio assumption.
# gamma=2 is standard (Lin et al. RetinaNet); down-weights easy negatives
# automatically without any dataset-specific calibration.
use_focal_loss: true
focal_gamma:    2.0

huber_delta:  0.3

loss_weight_presence: 0.4
loss_weight_weight:   1.0
loss_weight_aux:      0.1

log_scale_weight:     true
weight_noise_std:     0.05

lr_patience:              30
early_stopping_patience:  80

checkpoint_dir: checkpoints/salted_water_salt_model_natural/
