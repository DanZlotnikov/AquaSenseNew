# Training configuration — carp length model.
# All paths are relative to the project root.

# --- Data ---
data_dir: data/carp/
batch_size: 32

# --- Training ---
max_epochs: 300
lr: 1.0e-3
weight_decay: 1.0e-4

# --- Loss ---
pos_weight: 4.0
huber_delta: 1.0
loss_weight_presence: 0.4
loss_weight_length: 1.5

# Label noise std (cm)
length_noise_std: 1.0

# --- Learning rate scheduler ---
lr_patience: 15

# --- Early stopping ---
early_stopping_patience: 40

# --- Checkpoints ---
checkpoint_dir: checkpoints/carp/
