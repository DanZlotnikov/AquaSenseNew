data_dir: data/carp_presence_v2/

batch_size: 32

max_epochs:   400
lr:           1.0e-3
weight_decay: 1.0e-4

# pos_weight raised to 3.0 to compensate for harder negatives (GT=0 flat files
# are easier to reject, so the model needs more incentive to detect positives)
pos_weight:           3.0
huber_delta:          1.0
loss_weight_presence: 1.0
loss_weight_length:   0.0

length_noise_std: 0.0

lr_patience:              20
early_stopping_patience:  60

checkpoint_dir: checkpoints/carp_presence_v2/
