data_dir:   data/carp/salted_water_split/
train_file: data/carp/salted_water_split/train_salt.npz
val_file:   data/carp/salted_water_split/val_salt.npz

batch_size:   32
max_epochs:   500
lr:           1.0e-3
weight_decay: 1.0e-4

pos_weight:   4.0    # upweight fish-present class (~10 % positive ratio)
huber_delta:  0.3    # ~30 % error in log-weight space before switching to L1

loss_weight_presence: 0.4
loss_weight_weight:   1.0
loss_weight_aux:      0.1   # internal water-condition head (self-supervised)

log_scale_weight:     true
weight_noise_std:     0.05

lr_patience:              25
early_stopping_patience:  60

checkpoint_dir: checkpoints/salted_water_salt_model/
